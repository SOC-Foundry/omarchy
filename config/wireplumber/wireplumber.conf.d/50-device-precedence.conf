## CHG-007 / CHG-010 — device precedence (sinks + sources)
## Host: 83te (Yoga 7 2-in-1 16IPH11)
##
## Output order:
##   1. soundcore P30i          (BT A2DP)           priority ~2500
##   2. Lenovo USB-C In-Ear                         ~1500
##   3. AUX 3.5mm headset (sof Jack Out)            ~1000
##   4. Built-in speakers (sof Speaker)             ~400
##
## Input order (among available sources):
##   1. soundcore P30i mic (HFP only; A2DP has no capture)
##   2. Lenovo USB-C mic
##   3. AUX headset mic (sof Jack In)
##   4. Built-in dmic
##   5. USB camera mic last                         ~50
##
## Why pro-audio on sof-soundwire (rt721 hs + rt721/rt1320 spk):
##   PCM map (card "sofsoundwire"):
##     pro-output-0  hw:N,0   = Jack Out   ← AUX / 3.5mm headphones
##     pro-input-1   hw:N,1   = Jack In    ← AUX headset mic
##     pro-output-2  hw:N,2   = Speaker    ← built-in speakers
##     pro-input-10  hw:N,10  = DMIC Raw   ← built-in array mic
##     pro-output-5..7        = HDMI       (disabled)
##     pro-output-31          = Deepbuffer Jack Out (disabled)
##
## stereo-fallback has proper speaker/HP ports but sources:0 — no dmic —
## so pro-audio is required to keep last-resort capture. CHG-007 originally
## nicknamed pro-output-0 "Built-in Speakers"; that node is actually Jack Out.
## CHG-010 corrects the map and inserts AUX between USB-C and speakers.

# ---------------------------------------------------------------------------
# Bluetooth (soundcore P30i and any future BT headsets)
# ---------------------------------------------------------------------------
monitor.bluez.rules = [
  # Generic BT first; P30i-specific rules below override
  {
    matches = [
      { node.name = "~bluez_output.*" }
    ]
    actions = {
      update-props = {
        priority.session = 2400
        priority.driver  = 2400
      }
    }
  }
  {
    matches = [
      { node.name = "~bluez_input.*" }
    ]
    actions = {
      update-props = {
        priority.session = 2400
        priority.driver  = 2400
      }
    }
  }
  {
    matches = [
      { node.name = "~bluez_output.F4_B6_2D_75_CE_92.*" }
    ]
    actions = {
      update-props = {
        priority.session = 2500
        priority.driver  = 2500
        node.nick        = "soundcore P30i"
      }
    }
  }
  {
    matches = [
      { node.name = "~bluez_input.F4_B6_2D_75_CE_92.*" }
    ]
    actions = {
      update-props = {
        priority.session = 2500
        priority.driver  = 2500
        node.nick        = "soundcore P30i Mic"
      }
    }
  }
]

# ---------------------------------------------------------------------------
# ALSA: Lenovo USB-C, sof AUX + speakers/dmic, camera
# ---------------------------------------------------------------------------
monitor.alsa.rules = [
  # --- Lenovo USB-C Wired In-Ear (Synaptics 17ef:a05f) — desk backup ---
  {
    matches = [
      { node.name = "~alsa_output.usb-Synaptics_Lenovo_USB-C_Wired_In-Ear.*" }
    ]
    actions = {
      update-props = {
        priority.session = 1500
        priority.driver  = 1500
        node.nick        = "Lenovo USB-C"
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.usb-Synaptics_Lenovo_USB-C_Wired_In-Ear.*" }
    ]
    actions = {
      update-props = {
        priority.session = 1500
        priority.driver  = 1500
        node.nick        = "Lenovo USB-C Mic"
      }
    }
  }
  # Device-level: keep dual profile (stereo out + mono mic)
  {
    matches = [
      {
        device.name = "~alsa_card.usb-Synaptics_Lenovo_USB-C_Wired_In-Ear.*"
      }
    ]
    actions = {
      update-props = {
        device.profile = "output:analog-stereo+input:mono-fallback"
      }
    }
  }

  # --- Built-in sof-soundwire: pro-audio for separate Jack / Speaker / DMIC ---
  {
    matches = [
      {
        device.name = "alsa_card.pci-0000_00_1f.3-platform-sof_sdw"
      }
    ]
    actions = {
      update-props = {
        device.profile = "pro-audio"
      }
    }
  }

  # Disable HDMI + deepbuffer Jack Out; keep 0 (AUX), 2 (speakers).
  {
    matches = [
      {
        node.name = "~alsa_output.pci-0000_00_1f.3-platform-sof_sdw.pro-output-5.*"
      }
      {
        node.name = "~alsa_output.pci-0000_00_1f.3-platform-sof_sdw.pro-output-6.*"
      }
      {
        node.name = "~alsa_output.pci-0000_00_1f.3-platform-sof_sdw.pro-output-7.*"
      }
      {
        node.name = "~alsa_output.pci-0000_00_1f.3-platform-sof_sdw.pro-output-31.*"
      }
      {
        # Any other pro playback we have not named (safety net)
        node.name = "~alsa_output.pci-0000_00_1f.3-platform-sof_sdw.pro-output-[13489].*"
      }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }

  # --- 3) AUX 3.5mm headset (Jack Out / Jack In) — always-on at desk ---
  {
    matches = [
      {
        node.name = "alsa_output.pci-0000_00_1f.3-platform-sof_sdw.pro-output-0"
      }
    ]
    actions = {
      update-props = {
        priority.session = 1000
        priority.driver  = 1000
        node.nick        = "AUX Headset"
        node.description = "AUX 3.5mm Headset (Jack Out)"
      }
    }
  }
  {
    matches = [
      {
        node.name = "alsa_input.pci-0000_00_1f.3-platform-sof_sdw.pro-input-1"
      }
    ]
    actions = {
      update-props = {
        priority.session = 1000
        priority.driver  = 1000
        node.nick        = "AUX Headset Mic"
        node.description = "AUX 3.5mm Headset Mic (Jack In)"
      }
    }
  }

  # --- 4) Built-in speakers + dmic (last hardware resort before camera) ---
  {
    matches = [
      {
        node.name = "alsa_output.pci-0000_00_1f.3-platform-sof_sdw.pro-output-2"
      }
    ]
    actions = {
      update-props = {
        priority.session = 400
        priority.driver  = 400
        node.nick        = "Built-in Speakers"
        node.description = "Built-in Speakers"
      }
    }
  }
  {
    matches = [
      {
        node.name = "alsa_input.pci-0000_00_1f.3-platform-sof_sdw.pro-input-10"
      }
    ]
    actions = {
      update-props = {
        priority.session = 400
        priority.driver  = 400
        node.nick        = "Built-in Mic"
        node.description = "Built-in DMIC"
      }
    }
  }

  # Disable any other pro capture (keep Jack In = 1 and DMIC = 10 only)
  {
    matches = [
      {
        node.name = "~alsa_input.pci-0000_00_1f.3-platform-sof_sdw.pro-input-[02-9].*"
      }
      {
        node.name = "~alsa_input.pci-0000_00_1f.3-platform-sof_sdw.pro-input-1[1-9].*"
      }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }

  # --- USB camera mic — last ---
  {
    matches = [
      { node.name = "~alsa_input.usb-Sonix_Technology.*" }
      { node.name = "~alsa_input.usb-.*Camera.*" }
    ]
    actions = {
      update-props = {
        priority.session = 50
        priority.driver  = 50
        node.nick        = "USB Camera Mic"
      }
    }
  }
]
